    let secondsElapsed = 0;
    let timerInterval = setInterval(() => {
        secondsElapsed++;
        let mins = String(Math.floor(secondsElapsed / 60)).padStart(2, '0');
        let secs = String(secondsElapsed % 60).padStart(2, '0');
        document.getElementById('timer').innerText = `${mins}:${secs}`;
    }, 1000);

    function renderQuestions() {
        const container = document.getElementById('questions-container');
        container.innerHTML = '';

        questionsData.forEach((q, index) => {
            const card = document.createElement('div');
            card.className = 'question-card';
            card.id = `q-card-${q.id}`;

            let optionsHTML = '';
            for (let optKey in q.options) {
                optionsHTML += `
                    <label class="option-item" onclick="updateCount()">
                        <input type="radio" name="question_${q.id}" value="${optKey}">
                        <span><strong>${optKey}.</strong> ${q.options[optKey]}</span>
                    </label>
                `;
            }

            card.innerHTML = `
                <span class="category-tag">${q.category}</span>
                <div class="question-title">${q.id}. ${q.question}</div>
                <div class="options-list">${optionsHTML}</div>
                <div class="explanation" id="exp-${q.id}">
                    <strong>Kunci Jawaban: ${q.answer}</strong><br>
                    ${q.explanation}
                </div>
            `;
            container.appendChild(card);
        });
    }

    function updateCount() {
        const formData = new FormData(document.getElementById('quiz-form'));
        let answered = 0;
        for (let i = 1; i <= 50; i++) {
            if (formData.get(`question_${i}`)) answered++;
        }
        document.getElementById('answered-count').innerText = `Terjawab: ${answered} / 50`;
    }

    function submitQuiz() {
        clearInterval(timerInterval);
        const formData = new FormData(document.getElementById('quiz-form'));
        let correct = 0;

        questionsData.forEach(q => {
            const userAns = formData.get(`question_${q.id}`);
            const expBox = document.getElementById(`exp-${q.id}`);
            expBox.style.display = 'block';

            if (userAns === q.answer) {
                correct++;
            }
        });

        let score = (correct / questionsData.length) * 100;
        document.getElementById('final-score').innerText = score.toFixed(0);
        document.getElementById('count-correct').innerText = correct;
        document.getElementById('count-wrong').innerText = questionsData.length - correct;

        document.getElementById('result-modal').style.display = 'flex';
    }

    function closeModal() {
        document.getElementById('result-modal').style.display = 'none';
        window.scrollTo({ top: 0, behavior: 'smooth' });
    }

    renderQuestions();
</script>
